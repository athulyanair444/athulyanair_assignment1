<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You</title>

  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet" />
</head>

<body>

  <!-- HEADER -->
  <div id="banner">
    <div class="banner-left">
      <img src="logo.png" alt="UnityCare Health Logo" id="logo" />
    </div>

    <div class="banner-center">
      <h1>UnityCare Health</h1>
      <p class="tagline">Patient Registration</p>
    </div>

    <div class="banner-right">
      <p class="date-line">Submission Complete</p>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main" style="text-align: center; padding: 60px 20px;">
    <h2 style="font-size: 32px;">Thank You!</h2>

    <p style="font-size: 18px; margin-top: 10px;">
      Your patient registration form has been successfully submitted.
    </p>

    <p style="margin-top: 20px;">
      A member of our team will review your information and contact you if needed.
    </p>

    <div style="margin-top: 40px;">
      <a href="homework2.html">
        <button class="btn primary">Return to Form</button>
      </a>
    </div>
  </div>

  <!-- FOOTER -->
  <footer id="footer">
    <div class="footer-left">
      <strong>UnityCare Health</strong><br />
      PO BOX 18881<br />
      Sugar Land, TX 77496
    </div>

    <div class="footer-center">
      <button
        type="button"
        class="footer-btn"
        onclick="alert('Contact Us: unitycarehealth@gmail.com')"
      >
        CONTACT US
      </button>
    </div>

    <div class="footer-right">
      <a href="https://www.facebook.com" target="_blank">Facebook</a>
      <span class="dot">•</span>
      <a href="https://www.twitter.com" target="_blank">Twitter</a>
      <span class="dot">•</span>
      <a href="https://www.instagram.com" target="_blank">Instagram</a>
    </div>
  </footer>

</body>
</html>
